[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ayllu"
version = "1.4.0"
description = "Ayllu Counsel — evidence-bound holographic agent council + psyche"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "SZL Holdings" }]
keywords = ["agent-council", "fail-closed", "governed-ai", "fastapi", "huggingface-space"]
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "httpx>=0.27.0",
]
# A Hugging Face Space application, not a PyPI distribution: keep "Do Not Upload".
classifiers = [
  "Private :: Do Not Upload",
  "Framework :: FastAPI",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://huggingface.co/spaces/SZLHOLDINGS/ayllu"
Source = "https://github.com/szl-holdings/ayllu"
Issues = "https://github.com/szl-holdings/ayllu/issues"

[project.optional-dependencies]
test = ["pytest>=8.0", "pyyaml>=6.0"]

[tool.setuptools.packages.find]
include = ["ayllu*"]

[tool.setuptools.package-data]
ayllu = ["**/*.json", "**/*.html", "**/*.md", "**/*.pub"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
