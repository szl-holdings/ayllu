name: hf-space
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check "huggingface_hub==1.23.0"
      - name: Push Docker Space SZLHOLDINGS/ayllu
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'PY'
          import os, sys
          token = os.environ.get("HF_TOKEN") or ""
          if not token:
              print("HF_TOKEN UNAVAILABLE — Space publish skipped. Not fabricated LIVE.")
              sys.exit(0)
          from huggingface_hub import HfApi
          api = HfApi(token=token)
          # Space already exists. create_repo hits Hub space-creation rate limit (20/day).
          api.upload_folder(
              folder_path=".",
              repo_id="SZLHOLDINGS/ayllu",
              repo_type="space",
              ignore_patterns=[".git*", "tests/*", ".venv/*", ".pytest_cache/*", "**/__pycache__/*", "**/*.pyc"],
          )
          print("published SZLHOLDINGS/ayllu")
          PY
