name: hf-space
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install huggingface_hub
      - name: Push Docker Space SZLHOLDINGS/ayllu
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'PY'
          import os, sys
          token = os.environ.get("HF_TOKEN") or ""
          if not token:
              print("HF_TOKEN UNAVAILABLE — Space publish skipped. Not fabricated LIVE.")
              sys.exit(0)
          from huggingface_hub import HfApi, create_repo
          api = HfApi(token=token)
          create_repo("SZLHOLDINGS/ayllu", repo_type="space", space_sdk="docker", exist_ok=True, token=token)
          api.upload_folder(
              folder_path=".",
              repo_id="SZLHOLDINGS/ayllu",
              repo_type="space",
              ignore_patterns=[".git*", "tests/*", ".venv/*"],
          )
          print("published SZLHOLDINGS/ayllu")
          PY
