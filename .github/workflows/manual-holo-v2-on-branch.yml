name: Install Ayllu Holo-Constellation v2 on Branch

on:
  push:
    branches:
      - design/holographic-space-v2-manual
    paths:
      - ".github/workflows/manual-holo-v2-on-branch.yml"

permissions:
  contents: write

concurrency:
  group: ayllu-holo-v2-manual
  cancel-in-progress: false

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact adapter branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: design/holographic-space-v2-manual
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Fetch immutable first-party Holo assets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from urllib.request import Request, urlopen

          base = "https://raw.githubusercontent.com/szl-holdings/a11oy/a8494fc4d40d0918d33d72e64739eedbd4c33803/console/assets"
          target = Path("ayllu/static")
          target.mkdir(parents=True, exist_ok=True)
          for name in ("szl-holo-v2.css", "szl-holo-v2.js"):
              request = Request(f"{base}/{name}", headers={"User-Agent": "szl-ayllu-holo-adapter/2"})
              with urlopen(request, timeout=30) as response:
                  payload = response.read()
              if len(payload) < 1000:
                  raise SystemExit(f"canonical asset unexpectedly small: {name}")
              (target / name).write_bytes(payload)
          PY

      - name: Bind all three Ayllu surfaces and asset routes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          style = '<link rel="stylesheet" href="/assets/szl-holo-v2.css" data-szl-holo-asset="style-v2" />'
          script = '<script src="/assets/szl-holo-v2.js" defer data-szl-holo-asset="script-v2"></script>'
          for relative in (
              "ayllu/static/chamber.html",
              "ayllu/static/counsel.html",
              "ayllu/static/psyche.html",
          ):
              path = Path(relative)
              text = path.read_text(encoding="utf-8")
              if style not in text:
                  marker = text.lower().rfind("</head>")
                  if marker < 0:
                      raise SystemExit(f"missing </head>: {relative}")
                  text = text[:marker] + "  " + style + "\n" + text[marker:]
              if script not in text:
                  marker = text.lower().rfind("</body>")
                  if marker < 0:
                      raise SystemExit(f"missing </body>: {relative}")
                  text = text[:marker] + "  " + script + "\n" + text[marker:]
              path.write_text(text, encoding="utf-8", newline="\n")

          path = Path("app.py")
          text = path.read_text(encoding="utf-8")
          constants_anchor = 'PSYCHE_HTML = Path(__file__).resolve().parent / "ayllu" / "static" / "psyche.html"\n'
          constants = constants_anchor + 'HOLO_CSS = Path(__file__).resolve().parent / "ayllu" / "static" / "szl-holo-v2.css"\nHOLO_JS = Path(__file__).resolve().parent / "ayllu" / "static" / "szl-holo-v2.js"\n'
          if "HOLO_CSS =" not in text:
              if constants_anchor not in text:
                  raise SystemExit("Ayllu static path anchor not found")
              text = text.replace(constants_anchor, constants, 1)

          route_anchor = '@app.get("/", response_class=HTMLResponse)\n'
          routes = '''@app.get("/assets/szl-holo-v2.css", include_in_schema=False)\ndef holo_css() -> PlainTextResponse:\n    return PlainTextResponse(HOLO_CSS.read_text(encoding="utf-8"), media_type="text/css")\n\n\n@app.get("/assets/szl-holo-v2.js", include_in_schema=False)\ndef holo_js() -> PlainTextResponse:\n    return PlainTextResponse(HOLO_JS.read_text(encoding="utf-8"), media_type="application/javascript")\n\n\n'''
          if "def holo_css" not in text:
              if route_anchor not in text:
                  raise SystemExit("Ayllu root route anchor not found")
              text = text.replace(route_anchor, routes + route_anchor, 1)
          path.write_text(text, encoding="utf-8", newline="\n")
          PY

      - name: Prove source-native binding
        run: |
          python3 -m py_compile app.py
          python3 -m compileall -q ayllu
          python3 - <<'PY'
          from pathlib import Path
          for relative in (
              "ayllu/static/chamber.html",
              "ayllu/static/counsel.html",
              "ayllu/static/psyche.html",
          ):
              text = Path(relative).read_text(encoding="utf-8")
              assert text.count('data-szl-holo-asset="style-v2"') == 1, relative
              assert text.count('data-szl-holo-asset="script-v2"') == 1, relative
          app = Path("app.py").read_text(encoding="utf-8")
          assert app.count('def holo_css') == 1
          assert app.count('def holo_js') == 1
          PY
          git diff --check

      - name: Commit adapter and remove one-shot controller
        run: |
          set -euo pipefail
          rm .github/workflows/manual-holo-v2-on-branch.yml
          git config user.name "SZL Ayllu Holo Controller"
          git config user.email "stephenlutar2@gmail.com"
          git add app.py ayllu/static/chamber.html ayllu/static/counsel.html ayllu/static/psyche.html ayllu/static/szl-holo-v2.css ayllu/static/szl-holo-v2.js .github/workflows/manual-holo-v2-on-branch.yml
          git commit -s -m "feat(frontend): install Ayllu Holo-Constellation v2"
          git push origin HEAD:design/holographic-space-v2-manual
