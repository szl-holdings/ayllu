name: cf-www-apex
on:
  workflow_dispatch:
    inputs:
      cf_api_token:
        description: "Optional one-shot Cloudflare token if repo secret is empty"
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - scripts/cf_www_apex.py
      - .github/workflows/cf-www-apex.yml

permissions:
  contents: read

jobs:
  redirect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: mask dispatch token
        if: ${{ github.event.inputs.cf_api_token != '' }}
        env:
          CF_API_TOKEN: ${{ github.event.inputs.cf_api_token }}
        run: echo "::add-mask::${CF_API_TOKEN}"
      - name: www 301 and killinchu CNAME
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN || github.event.inputs.cf_api_token }}
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
        run: python scripts/cf_www_apex.py
