name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      # Hash-pinned lock of requirements.txt's runtime packages plus pytest and pyyaml
      # (requirements/ci/test.in; recompile command in its header).
      - run: python -m pip install --require-hashes -r requirements/ci/test.txt
      - run: python -m ayllu.selftest
      - run: PYTHONPATH=. pytest -q

  # The Space runs the Dockerfile's python:3.15-slim image, so test that minor too:
  # the same hash-pinned lock (the image itself installs requirements.txt unpinned),
  # then the package itself from pyproject with --no-deps.
  # A separate job, not a matrix: `selftest` stays the ruleset's required context.
  space-python:
    name: selftest on the Space interpreter (3.15)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
          allow-prereleases: true
      - run: python -m pip install --require-hashes -r requirements/ci/test.txt
      - run: python -m pip install --no-deps -e .
      - run: python -m ayllu.selftest
      - run: python -m pytest
